services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: buttongame
      MYSQL_USER: buttongame
      MYSQL_PASSWORD: buttongame
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./BACKEND
    restart: unless-stopped
    environment:
      PORT: 8000
      NODE_ENV: development
      SESSION_SECRET: dev-secret-change-me
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: buttongame
      DB_PASSWORD: buttongame
      DB_NAME: buttongame
      CORS_ORIGIN: "*"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
